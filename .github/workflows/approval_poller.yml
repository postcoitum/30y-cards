# 이 파일이 사는 곳: **postcoitum/30y-cards** 레포의 .github/workflows/approval_poller.yml
#
# 왜 여기(공개 레포)인가:
#   remind(인스타에 실제로 게시됐는지 Buffer에 물어보는 일)는 하루 종일 20분마다
#   깨어나야 한다. private 레포(30y)에서 돌리면 그 시간이 전부 Actions 분으로 과금돼
#   무료 2,000분/월을 넘긴다. **공개 레포는 표준 러너가 무제한 무료**다. 코드는
#   private 30y에 그대로 두고 PAT로 체크아웃해서 쓴다.
#
# 승인은 이제 cron이 아니라 **웹훅**으로 온다:
#   버튼 누름 → 텔레그램 → Cloudflare Worker → repository_dispatch → 이 워크플로
#   (deploy/cloudflare/worker.js 와 README.md 참고)
#   예전엔 20분마다 getUpdates로 가지러 갔고, 그래서 버튼을 눌러도 평균 20~30분,
#   나쁘면 1시간이 걸렸다. GitHub cron은 예약 시각을 보장하지 않고 매일 10~45분씩
#   밀리므로 주기를 조여도 해결되지 않는다.
#
# 보안:
#   공개 레포라 실행 로그도 공개된다. 트리거를 schedule / workflow_dispatch /
#   repository_dispatch로만 둔 것은 의도적이다 - pull_request를 켜면 남의 포크 PR에서
#   시크릿을 빼갈 수 있다. 켜지 말 것. (GitHub이 시크릿 값 자체는 로그에서 마스킹하지만,
#   트리거 구멍은 막아주지 않는다.)
#   repository_dispatch는 토큰 없이는 못 쏘고, 그 토큰은 Cloudflare Worker 안에만 있다.

name: 카드 승인 지킴이

on:
  # 승인/수정 지시가 들어오는 길. Cloudflare Worker만 이걸 쏠 수 있다.
  repository_dispatch:
    types: [telegram-update]
  schedule:
    # 20분마다, 00:00~14:59 UTC = 09:00~23:59 KST. 자는 시간엔 깨우지 않는다.
    # 이제 이 주기가 하는 일은 remind(게시 감지)뿐이다 - 승인은 위 웹훅이 받는다.
    - cron: '*/20 0-14 * * *'
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 끝날 때까지 기다린다. 같은 승인을 두 번 처리해
# 인스타에 같은 카드가 두 번 올라가는 사고를 막는다. 웹훅이 붙어 실행이 잦아졌으므로
# 오히려 더 중요해졌다 - 버튼을 연타해도 순서대로 한 번씩만 처리된다.
concurrency:
  group: approval-poller
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 파이프라인 코드 체크아웃 (private 30y)
        uses: actions/checkout@v4
        with:
          repository: postcoitum/30y
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # 대기열 변경을 다시 커밋해야 하므로 push 권한이 있는 토큰을 유지한다.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 대부분의 실행은 "대기 없음"으로 몇 초 만에 끝난다. 그 흔한 경우를 위해
      # Playwright/Pillow까지 깔지 않는다 - 렌더가 필요한 수정 단계에서만 깐다.
      - name: 가벼운 의존성만 설치
        run: pip install requests python-dotenv

      - name: 승인 처리
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          # 웹훅 모드 스위치. true면 poll(getUpdates)을 건너뛴다 - 웹훅을 건 봇에서는
          # getUpdates가 409로 막히기 때문이다. 웹훅이 고장나 되돌릴 때는
          # `python telegram_inbox.py --delete-webhook` 후 이 변수를 false로.
          TELEGRAM_USE_WEBHOOK: ${{ vars.TELEGRAM_USE_WEBHOOK }}
          # 웹훅이 실어 보낸 업데이트. cron 실행 때는 빈 값이라 hook이 조용히 끝난다.
          # 셸 명령이 아니라 **환경변수**로 넘기는 이유: 사람이 쓴 자유 문장(수정 지시)이
          # 그대로 들어와 셸 이스케이프 사고가 나기 쉽다.
          TELEGRAM_UPDATE_JSON: ${{ toJSON(github.event.client_payload.update) }}
          # 연습 스위치. 레포 변수(Settings > Variables)에 true를 넣어두면 ✅를 눌러도
          # 예약하지 않고 Buffer 초안으로만 저장한다 - 인스타에 올라가지 않는다.
          # 변수가 없으면 빈 문자열이라 config가 false로 읽는다(= 실제 예약).
          BUFFER_SAVE_TO_DRAFT: ${{ vars.BUFFER_SAVE_TO_DRAFT }}
          # 발행 예약 유실 감시(publish_watchdog.py)가 대리 발행을 요청할 때 쓰는 토큰.
          # 체크아웃에 쓰는 것과 같은 시크릿을 재사용한다 - 별도 등록 불필요.
          GH_DISPATCH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # 웹훅으로 승인/수정 지시가 왔다. 이 경로에서는 remind를 돌리지 않는다 -
            # Buffer 상태 조회는 시간이 걸리는데 사람은 버튼의 반응을 기다리고 있다.
            python approval_bot.py hook
          else
            # 주기 실행. 게시 감지가 본업이고, poll은 웹훅을 떼고 롤백했을 때만 일한다.
            python approval_bot.py poll
            python approval_bot.py remind
            # 발행 예약이 아예 유실됐는지(8/4 사고) 확인하고 필요하면 대신 깨운다.
            # 웹훅 분기(hook)에는 넣지 않는다 - 버튼 클릭과는 무관한 별개의 점검이다.
            # 실패해도 본업(승인 처리)을 죽이지 않도록 run() 내부에서 항상 0을 반환한다.
            python publish_watchdog.py
          fi
          if ls pending/*.json >/dev/null 2>&1 && \
             grep -l '"status": "revision_requested"' pending/*.json >/dev/null 2>&1; then
            echo "needs_revision=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 여기부터는 수정 요청이 들어왔을 때만 돈다 ----

      - name: Claude가 문구를 고친다
        id: claude_edit
        if: steps.poll.outputs.needs_revision == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            pending/ 디렉터리에서 "status": "revision_requested" 인 JSON 파일을 찾아라.
            그 파일의 revision_instruction 이 사람이 텔레그램으로 보낸 수정 지시다.

            지시대로 같은 파일 안 news_json 의 슬라이드 텍스트를 고쳐라.

            지켜야 할 것:
            - 고칠 수 있는 것은 텍스트뿐이다: card_slides[].headline, sub_headline,
              body_text, 그리고 instagram_caption 의 hook_line / main_caption /
              call_to_action / hashtags.
            - bg_image_url, image_source, short_credit, image_verdict, slide_number,
              type 은 **절대 건드리지 마라.** 사진은 이미 검증을 통과한 것들이다.
            - body_text 는 슬라이드당 합계 100자 이하, 완결된 문장 1~2개. 넘치면 문장을
              줄이지 말고 다른 슬라이드로 나눠 담아라.
            - body_text 에 \n 을 넣지 마라. 줄바꿈은 renderer.py 가 정한다.
            - 날짜는 hook_line 에만 넣는다. main_caption 은 "30년 전 오늘,"로 연다.
            - 해시태그는 캡션 본문에 넣지 마라.
            - 사실관계를 새로 지어내지 마라. 지시가 사실 변경을 요구하면 고치지 말고
              revision_instruction 자리에 왜 못 고쳤는지 적어라.

            JSON 파일만 수정하고 다른 파일은 건드리지 마라. 커밋하지 마라.

      - name: 수정 실패 알림 및 상태 전환
        if: failure() && steps.poll.outputs.needs_revision == 'true' && steps.claude_edit.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python approval_bot.py revision_failed

      # 발행 워크플로(daily_30y_news.yml)에 ffmpeg 보장 스텝이 따로 있다는 것은
      # 러너에 ffmpeg이 있다고 믿을 수 없다는 뜻이다. 수정 경로는 cmd_resend()에서
      # 릴스를 새 커버로 재생성하는데, 그 실패는 try/except에 삼켜져 reel_video_url이
      # None이 된다 - 즉 ffmpeg이 없으면 "✏️ 수정하면 릴스가 조용히 사라지는" 버그가
      # 되고, 캐러셀은 정상 재전송되므로 아무도 눈치채지 못한다. 발행 워크플로와
      # 같은 보장을 여기에도 둔다.
      - name: 수정본 렌더링 준비
        if: steps.poll.outputs.needs_revision == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg 미설치 - apt로 설치합니다 (릴스 재생성용)"
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 수정본 재전송
        if: steps.poll.outputs.needs_revision == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDS_REPO_TOKEN: ${{ secrets.CARDS_REPO_TOKEN }}
          # 이 스텝이 renderer.py로 수정본을 다시 렌더링한다. .env는 이 러너에 없으므로
          # 발행 워크플로와 같은 방식으로 레포 변수를 읽는다 (기본값 v1 유지).
          KOREAN_LINEBREAK_ENGINE: ${{ vars.KOREAN_LINEBREAK_ENGINE || 'v1' }}
        run: |
          python approval_bot.py resend

      - name: 대기열 변경 커밋
        if: always()
        # 2026-08-09: 이 스텝의 git push 인증 복구 패치가 실제로 라이브에서 동작하는지
        # sync_cards_repo.yml을 통한 실전 배포로 재검증했다 (CARDS_REPO_TOKEN에
        # workflow 스코프를 추가한 뒤 - 스코프 없이는 이 파일 자체의 배포도 막힌다).
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # claude-code-action이 여기 오는 동안 git 인증정보(remote/extraheader)를 자기
          # GitHub App 설치 토큰으로 덮어쓰고 종료 시 revoke한다. 그대로 두면 push가
          # "Invalid username or token"으로 조용히 실패한다(2026-08-08 사고, 재현율 100%).
          # 매 실행마다 우리 토큰으로 되돌려놓고 push한다.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/postcoitum/30y.git"
          git add pending/ || true
          git diff --staged --quiet || git commit -m "pending: 승인 처리 결과 반영"
          if ! git push; then
            echo "::error::push 실패 - 승인/수정 처리 결과가 GitHub에 반영되지 않았습니다"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ 승인/수정 처리 결과를 GitHub에 반영하지 못했습니다(git push 실패). 방금 누른 버튼이나 보낸 수정 지시가 적용되지 않았을 수 있습니다 - 다시 시도해주세요." \
              || true
            exit 1
          fi

      # 2026-08-13 사고: "승인 처리" 스텝(python approval_bot.py hook)이 예외로 죽으면
      # 텔레그램에는 answer_callback의 "접수했습니다" 토스트만 가고 그 뒤로 아무 알림도
      # 안 갔다 - 파이썬이 죽어서 approval_bot.py 안의 알림(위 apply_decisions 수정 참고)
      # 조차 못 뜬 경우다. 사용자는 게시 여부를 몰라 버튼을 11번 더 눌렀다. 위 "수정 실패
      # 알림" 스텝은 수정(claude_edit) 실패만 잡으므로, 승인 처리 스텝 자체의 실패는 이
      # 조건 없는 if: failure() 로 잡는다. daily_30y_news.yml의 "Notify on failure"
      # 스텝과 같은 방식이다 - 본보기로 삼을 것.
      - name: 승인 처리 실패 알림 (조건 없음)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '%s\n%s\n%s' \
            "🚨 승인/수정 처리 중 오류가 발생했습니다. 버튼이나 수정 지시가 정상 처리되지 않았을 수 있습니다." \
            "⚠️ 다시 누르기 전에 인스타그램에 실제로 게시됐는지 먼저 확인해주세요 - 이미 게시됐는데 알림만 못 갔을 수 있습니다." \
            "로그: ${RUN_URL}")
          curl -sS --retry 4 --retry-delay 5 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            > /dev/null
