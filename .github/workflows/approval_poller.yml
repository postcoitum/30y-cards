# 이 파일이 사는 곳: **postcoitum/30y-cards** 레포의 .github/workflows/approval_poller.yml
#
# 왜 여기(공개 레포)인가:
#   자동 게시·구형 승인 처리가 여기서 돈다. private 레포(30y)에서 돌리면 Actions 분이
#   과금될 수 있어 공개 레포에 두고 코드는 PAT로 체크아웃한다. **공개 레포는 표준 러너가 무료**다.
#
# 승인은 이제 cron이 아니라 **웹훅**으로 온다:
#   버튼 누름 → 텔레그램 → Cloudflare Worker → repository_dispatch → 이 워크플로
#   (deploy/cloudflare/worker.js 와 README.md 참고)
#   예전엔 20분마다 getUpdates로 가지러 갔고, 그래서 버튼을 눌러도 평균 20~30분,
#   나쁘면 1시간이 걸렸다. GitHub cron은 예약 시각을 보장하지 않고 매일 10~45분씩
#   밀리므로 주기를 조여도 해결되지 않는다.
#
# 보안:
#   공개 레포라 실행 로그도 공개된다. 트리거를 schedule / workflow_dispatch /
#   repository_dispatch로만 둔 것은 의도적이다 - pull_request를 켜면 남의 포크 PR에서
#   시크릿을 빼갈 수 있다. 켜지 말 것. (GitHub이 시크릿 값 자체는 로그에서 마스킹하지만,
#   트리거 구멍은 막아주지 않는다.)
#   repository_dispatch는 토큰 없이는 못 쏘고, 그 토큰은 Cloudflare Worker 안에만 있다.

name: 카드 처리 지킴이

on:
  # 승인/수정 지시가 들어오는 길. Cloudflare Worker만 이걸 쏠 수 있다.
  repository_dispatch:
    types: [telegram-update, auto-publish]
  schedule:
    # 20분마다, 00:00~14:59 UTC = 09:00~23:59 KST. 자는 시간엔 깨우지 않는다.
    # 구형 승인과 텔레그램 폴백을 유지하고, 20시 이후에는 자동 게시 누락을 복구한다.
    - cron: '*/20 0-14 * * *'
    # 하루에 한 번 최종 확인. 재시도가 끝났는데 게시되지 않은 경우만 알린다.
    - cron: '30 14 * * *'
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 끝날 때까지 기다린다. 같은 승인을 두 번 처리해
# 인스타에 같은 카드가 두 번 올라가는 사고를 막는다. 웹훅이 붙어 실행이 잦아졌으므로
# 오히려 더 중요해졌다 - 버튼을 연타해도 순서대로 한 번씩만 처리된다.
concurrency:
  group: approval-poller
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # 2026-08-19 사고(발행 워크플로의 설치 단계가 5시간 넘게 멈춤)와 같은 유형이 여기서는
    # 더 나쁘다. 위 concurrency가 cancel-in-progress: false라 **멈춘 실행 하나가 뒤따르는
    # 모든 승인·게시 감지를 큐에 세워 영구 정지**시키기 때문이다. GitHub 기본 상한 6시간에
    # 맡기면 그동안 버튼이 아예 안 먹는다.
    #
    # 30분인 이유: 평상시 경로(체크아웃 2회 + `pip install requests` + 승인 처리 + 커밋)는
    # 3~5분이고, 게시까지 가도 컨테이너 대기가 캐러셀 60초·릴스 180초로 상한이 있다.
    # 가장 무거운 건 수정 요청 경로다 - `requirements.txt` 전체 설치와
    # `playwright install chromium --with-deps`(합쳐 5~7분)에 Gemini 문구 수정, 재렌더,
    # 재업로드, 재전송이 이어진다. 그 합을 넉넉히 잡아도 15분 안쪽이라 30분이면 2배 여유다.
    # 정상 작업을 끊지 않으면서 큐가 막히는 시간은 최대 30분으로 묶인다.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 파이프라인 코드 체크아웃 (private 30y)
        uses: actions/checkout@v4
        with:
          repository: postcoitum/30y
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # 대기열 변경을 다시 커밋해야 하므로 push 권한이 있는 토큰을 유지한다.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 대부분의 실행은 "대기 없음"으로 몇 초 만에 끝난다. 그 흔한 경우를 위해
      # Playwright/Pillow까지 깔지 않는다 - 렌더가 필요한 수정 단계에서만 깐다.
      - name: 가벼운 의존성만 설치
        run: pip install requests python-dotenv

      - name: 승인 처리
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 웹훅 모드 스위치. true면 poll(getUpdates)을 건너뛴다 - 웹훅을 건 봇에서는
          # getUpdates가 409로 막히기 때문이다. 웹훅이 고장나 되돌릴 때는
          # `python telegram_inbox.py --delete-webhook` 후 이 변수를 false로.
          TELEGRAM_USE_WEBHOOK: ${{ vars.TELEGRAM_USE_WEBHOOK }}
          # 웹훅이 실어 보낸 업데이트. cron 실행 때는 빈 값이라 hook이 조용히 끝난다.
          # 셸 명령이 아니라 **환경변수**로 넘기는 이유: 사람이 쓴 자유 문장(수정 지시)이
          # 그대로 들어와 셸 이스케이프 사고가 나기 쉽다.
          TELEGRAM_UPDATE_JSON: ${{ toJSON(github.event.client_payload.update) }}
          AUTO_PUBLISH_DATE: ${{ github.event.client_payload.publish_date }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "auto-publish" ]; then
              # auto_publisher.py는 auto_publish=true, status=ready인 새 항목만 처리한다.
              # 날짜가 비어 있으면 오늘(KST)만 선택하고 과거 승인 대기 항목은 보지 않는다.
              # 구 Worker의 07시 예약이 남아 있어도 20시 전 게시 금지.
              # 당시 날짜와 대상 날짜가 다르면 지연된 신호도 폐기한다.
              TODAY_KST=$(TZ=Asia/Seoul date +%F)
              HOUR_KST=$(TZ=Asia/Seoul date +%H)
              if [ "$HOUR_KST" -lt 20 ] || { [ -n "$AUTO_PUBLISH_DATE" ] && [ "$AUTO_PUBLISH_DATE" != "$TODAY_KST" ]; }; then
                echo "게시 허용 시간 또는 날짜가 아닙니다: ${AUTO_PUBLISH_DATE:-$TODAY_KST}"
                exit 0
              fi
              if [ -n "$AUTO_PUBLISH_DATE" ]; then
                python auto_publisher.py --date "$AUTO_PUBLISH_DATE"
              else
                python auto_publisher.py
              fi
            else
              python approval_bot.py hook
            fi
          else
            # 주기 실행. poll은 웹훅을 떼고 롤백했을 때만 필요하다.
            python approval_bot.py poll
            # 승인 대기가 2시간 넘게 안 닫히면 한 번 알린다(dispatch 유실/깜빡함 감지).
            # hook 분기에는 넣지 않는다 - 버튼 반응을 기다리는 경로라 느려지면 안 된다.
            python approval_bot.py stale
            # 정시 dispatch가 유실되거나 일시 장애가 생겨도 당일 20시 이후
            # 저장된 자동 게시 항목만 재시도한다. 지킴이 concurrency와 게시자
            # 내부의 날짜·Meta 중복 확인으로 다른 실행과 충돌하지 않는다.
            if [ "$(TZ=Asia/Seoul date +%H)" -ge 20 ]; then
              python auto_publisher.py --date "$(TZ=Asia/Seoul date +%F)" || echo "::warning::자동 게시 미완료: 다음 감시에서 재확인합니다"
            fi
          fi
          REVISION_FILE=
          if [ "${{ github.event.action }}" != "auto-publish" ]; then
            REVISION_FILE=$(grep -l '"status": "revision_requested"' pending/*.json 2>/dev/null | head -1 || true)
          fi
          if [ -n "$REVISION_FILE" ]; then
            echo "needs_revision=true" >> "$GITHUB_OUTPUT"
            # mixed는 사진 경로 한 프로세스에서 문구까지 합쳐 고친 뒤 한 번만 재전송한다.
            if grep -q '"revision_type": "image"' "$REVISION_FILE" || \
               grep -q '"revision_type": "mixed"' "$REVISION_FILE"; then
              echo "needs_image_revision=true" >> "$GITHUB_OUTPUT"
            fi
            if grep -q '"revision_type": "text"' "$REVISION_FILE"; then
              echo "needs_text_revision=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ---- 여기부터는 수정 요청이 들어왔을 때만 돈다 ----

      # 발행 워크플로(daily_30y_news.yml)에 ffmpeg 보장 스텝이 따로 있다는 것은
      # 러너에 ffmpeg이 있다고 믿을 수 없다는 뜻이다. 수정 경로는 cmd_resend()에서
      # 릴스를 새 커버로 재생성하는데, 그 실패는 try/except에 삼켜져 reel_video_url이
      # None이 된다 - 즉 ffmpeg이 없으면 "✏️ 수정하면 릴스가 조용히 사라지는" 버그가
      # 되고, 캐러셀은 정상 재전송되므로 아무도 눈치채지 못한다. 발행 워크플로와
      # 같은 보장을 여기에도 둔다.
      - name: 수정본 렌더링 준비
        id: prepare_revision
        if: steps.poll.outputs.needs_revision == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg 미설치 - apt로 설치합니다 (릴스 재생성용)"
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Gemini가 문구를 고친다
        id: text_edit
        if: steps.poll.outputs.needs_text_revision == 'true' && steps.prepare_revision.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 13
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDS_REPO_TOKEN: ${{ secrets.CARDS_REPO_TOKEN }}
          KOREAN_LINEBREAK_ENGINE: ${{ vars.KOREAN_LINEBREAK_ENGINE || 'v1' }}
        run: |
          python approval_bot.py edit_text

      - name: 검증 사진 보완
        id: repair_images
        if: steps.poll.outputs.needs_image_revision == 'true' && steps.prepare_revision.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 13
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDS_REPO_TOKEN: ${{ secrets.CARDS_REPO_TOKEN }}
          KOREAN_LINEBREAK_ENGINE: ${{ vars.KOREAN_LINEBREAK_ENGINE || 'v1' }}
        run: |
          python approval_bot.py repair_images

      - name: 수정 실패 알림 및 상태 전환
        id: revision_failed
        if: always() && steps.poll.outputs.needs_revision == 'true' && (steps.text_edit.outcome == 'failure' || steps.prepare_revision.outcome == 'failure' || steps.repair_images.outcome == 'failure')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python approval_bot.py revision_failed

      - name: 대기열 변경 커밋
        if: always()
        # 2026-08-09: 이 스텝의 git push 인증 복구 패치가 실제로 라이브에서 동작하는지
        # sync_cards_repo.yml을 통한 실전 배포로 재검증했다 (CARDS_REPO_TOKEN에
        # workflow 스코프를 추가한 뒤 - 스코프 없이는 이 파일 자체의 배포도 막힌다).
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 과거 외부 수정 action이 git 인증정보를 덮어쓴 사고 뒤부터 매 실행마다
          # 우리 토큰으로 되돌린다. 지금은 Gemini를 파이썬에서 직접 호출하지만,
          # 이 복구는 기존 실행/checkout 변화에도 안전한 방어선이라 유지한다.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/postcoitum/30y.git"
          # 카드 대기열뿐 아니라 MEMORY_90S 후보 승인/거절도 이 private 레포에
          # 누적해야 다음 일회용 러너가 같은 pool/거절 이력을 읽는다.
          git add pending/ data/nostalgia_pool/*.json PUBLISHED_HISTORY.md
          git diff --staged --quiet || git commit -m "pending: 승인 처리 결과 + MEMORY_90S 후보 반영"
          if ! git push; then
            echo "::error::push 실패 - 승인/수정 처리 결과가 GitHub에 반영되지 않았습니다"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ 승인/수정 처리 결과를 GitHub에 반영하지 못했습니다(git push 실패). 방금 누른 버튼이나 보낸 수정 지시가 적용되지 않았을 수 있습니다 - 다시 시도해주세요." \
              || true
            exit 1
          fi

      # 2026-08-13 사고: "승인 처리" 스텝(python approval_bot.py hook)이 예외로 죽으면
      # 텔레그램에는 answer_callback의 "접수했습니다" 토스트만 가고 그 뒤로 아무 알림도
      # 안 갔다 - 파이썬이 죽어서 approval_bot.py 안의 알림(위 apply_decisions 수정 참고)
      # 조차 못 뜬 경우다. 사용자는 게시 여부를 몰라 버튼을 11번 더 눌렀다. 위 "수정 실패
      # 알림" 스텝은 수정(text_edit) 실패만 잡으므로, 승인 처리 스텝 자체의 실패는 이
      # 조건 없는 if: failure() 로 잡는다. daily_30y_news.yml의 "Notify on failure"
      # 스텝과 같은 방식이다 - 본보기로 삼을 것.
      #
      # `|| cancelled()`가 필요한 이유: 위 timeout-minutes로 잡이 잘리면 conclusion이
      # failure가 아니라 **cancelled**라서 조건 없는 if: failure()로도 안 울린다.
      # daily_30y_news.yml이 같은 이유로 `failure() || cancelled()`를 쓴다.
      - name: 승인 처리 실패 알림 (조건 없음)
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '%s\n%s\n%s' \
            "🚨 승인/수정 처리가 작업 실패 또는 작업 한도 초과로 중단됐습니다. 버튼이나 수정 지시가 정상 처리되지 않았을 수 있습니다." \
            "⚠️ 다시 누르기 전에 인스타그램에 실제로 게시됐는지 먼저 확인해주세요 - 이미 게시됐는데 알림만 못 갔을 수 있습니다." \
            "로그: ${RUN_URL}")
          curl -sS --retry 4 --retry-delay 5 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            > /dev/null

      - name: 처리된 수정 실패를 실행 실패로 남긴다
        if: always() && steps.revision_failed.outcome == 'success'
        run: exit 1

      - name: 당일 발행 최종 확인 및 알림
        if: github.event_name == 'schedule' && github.event.schedule == '30 14 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 예약이 자정 이후에 도착하면 새 날짜의 항목을 확인하지 않는다.
          if [ "$(TZ=Asia/Seoul date +%H)" != 23 ]; then
            echo "최종 확인이 당일 23시 밖에 도착해 건너뜁니다"
            exit 0
          fi
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          export TODAY_KST
          RESULT=$(python -c 'import json,os,pending_store; d=os.environ["TODAY_KST"]; p=pending_store.load(d); a=os.path.join(pending_store.ARCHIVE_DIR,d+".json"); p=p or (json.load(open(a,encoding="utf-8")) if os.path.exists(a) else None); print("complete" if p and p.get("status")=="published" and p.get("media_ids",{}).get("reel") and p.get("media_ids",{}).get("carousel") else "manual" if p and not p.get("auto_publish") else (p or {}).get("status","missing"))')
          if [ "$RESULT" = complete ] || [ "$RESULT" = manual ]; then
            echo "최종 상태: $RESULT"
            exit 0
          fi
          echo "::error::$TODAY_KST 자동 게시 미완료: $RESULT"
          TEXT=$(printf '%s\n%s\n%s' "🚨 ${TODAY_KST} 자동 게시가 완료되지 않았습니다 (상태: ${RESULT})." "게시 여부와 차단 이유를 확인해 주세요." "로그: ${RUN_URL}")
          curl -fsS --retry 4 --retry-delay 5 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" | jq -e '.ok == true' >/dev/null
          exit 1
