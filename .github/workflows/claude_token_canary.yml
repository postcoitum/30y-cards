# 이 파일이 사는 곳: **postcoitum/30y-cards** 레포의 .github/workflows/claude_token_canary.yml
# (원본은 30y의 deploy/30y-cards/ - 손으로 복사하지 말 것, sync_cards_repo.yml이 반영한다)
#
# 왜 있는가:
#   `CLAUDE_CODE_OAUTH_TOKEN`은 "✏️ 수정" 기능에만 쓰이는데, 아무도 상태를 보지 않는다.
#   그래서 만료를 **사람이 수정 지시를 보낸 그 순간에** 알게 된다 - 카드를 고쳐야 하는
#   가장 급한 때다. 2026-08-04 · 08-08 · 08-21 세 번 모두 그랬다.
#   `META_ACCESS_TOKEN`은 token_refresh.py가 주 1회 챙기지만 이쪽은 대화형 로그인이라
#   자동 갱신이 불가능하다 - 그래서 **경보까지만** 한다.
#
# 왜 여기(공개 레포)인가:
#   점검 대상 시크릿이 여기 있고(수정 스텝이 이 레포에서 돈다), 공개 레포 러너는 무료다.
#
# 왜 주 1회인가:
#   승인 지킴이(20분마다)에 붙이면 하루 40번 Claude를 깨우게 된다. 만료를 며칠 안에만
#   알면 충분하다 - 수정 기능은 매일 쓰는 기능이 아니다.
name: Claude 토큰 만료 감시

on:
  schedule:
    # 월 02:00 UTC = 11:00 KST. 발행(07:15 UTC)과 겹치지 않는 한산한 시각.
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 토큰이 살아 있는지 보는 것이 전부다. 실제 수정 경로와 같은 액션·같은 시크릿을
      # 쓰는 것이 핵심 - 다른 방법으로 검사하면 "검사는 통과하는데 실전은 죽는" 상태가 된다.
      - name: 토큰으로 Claude를 한 번 깨워본다
        id: canary
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Reply with exactly: ok'

      - name: 죽었으면 알린다
        if: steps.canary.outcome != 'success'
        run: |
          curl -sS --retry 3 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🔑 Claude 토큰(CLAUDE_CODE_OAUTH_TOKEN)이 만료된 것 같습니다. 지금은 발행·보류·알림에 지장이 없지만, 이 상태로는 ✏️ 수정 지시가 실패합니다. 복구: claude setup-token → gh secret set CLAUDE_CODE_OAUTH_TOKEN -R postcoitum/30y-cards" \
            || true
