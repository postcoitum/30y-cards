# 이 파일이 사는 곳: **postcoitum/30y-cards** 레포의 .github/workflows/approval_poller.yml
#
# 왜 여기(공개 레포)인가:
#   지킴이는 하루 종일 20분마다 깨어나야 한다. private 레포(30y)에서 돌리면 그 시간이
#   전부 Actions 분으로 과금돼 무료 2,000분/월을 넘긴다. **공개 레포는 표준 러너가
#   무제한 무료**다. 코드는 private 30y에 그대로 두고 PAT로 체크아웃해서 쓴다.
#
# 보안:
#   공개 레포라 실행 로그도 공개된다. 트리거를 schedule / workflow_dispatch로만 둔 것은
#   의도적이다 - pull_request를 켜면 남의 포크 PR에서 시크릿을 빼갈 수 있다. 켜지 말 것.
#   (GitHub이 시크릿 값 자체는 로그에서 마스킹하지만, 트리거 구멍은 막아주지 않는다.)

name: 카드 승인 지킴이

on:
  schedule:
    # 20분마다, 00:00~14:59 UTC = 09:00~23:59 KST. 자는 시간엔 깨우지 않는다.
    - cron: '*/20 0-14 * * *'
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 새로 시작하지 않는다. 같은 승인을 두 번 처리해
# 인스타에 같은 카드가 두 번 올라가는 사고를 막는다.
concurrency:
  group: approval-poller
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: 파이프라인 코드 체크아웃 (private 30y)
        uses: actions/checkout@v4
        with:
          repository: postcoitum/30y
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          # 대기열 변경을 다시 커밋해야 하므로 push 권한이 있는 토큰을 유지한다.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 대부분의 실행은 "대기 없음"으로 몇 초 만에 끝난다. 그 흔한 경우를 위해
      # Playwright/Pillow까지 깔지 않는다 - 렌더가 필요한 수정 단계에서만 깐다.
      - name: 가벼운 의존성만 설치
        run: pip install requests python-dotenv

      - name: 텔레그램 답장 확인
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          # 연습 스위치. 레포 변수(Settings > Variables)에 true를 넣어두면 ✅를 눌러도
          # 예약하지 않고 Buffer 초안으로만 저장한다 - 인스타에 올라가지 않는다.
          # 변수가 없으면 빈 문자열이라 config가 false로 읽는다(= 실제 예약).
          BUFFER_SAVE_TO_DRAFT: ${{ vars.BUFFER_SAVE_TO_DRAFT }}
        run: |
          python approval_bot.py poll
          python approval_bot.py remind
          if ls pending/*.json >/dev/null 2>&1 && \
             grep -l '"status": "revision_requested"' pending/*.json >/dev/null 2>&1; then
            echo "needs_revision=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- 여기부터는 수정 요청이 들어왔을 때만 돈다 ----

      - name: Claude가 문구를 고친다
        if: steps.poll.outputs.needs_revision == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            pending/ 디렉터리에서 "status": "revision_requested" 인 JSON 파일을 찾아라.
            그 파일의 revision_instruction 이 사람이 텔레그램으로 보낸 수정 지시다.

            지시대로 같은 파일 안 news_json 의 슬라이드 텍스트를 고쳐라.

            지켜야 할 것:
            - 고칠 수 있는 것은 텍스트뿐이다: card_slides[].headline, sub_headline,
              body_text, 그리고 instagram_caption 의 hook_line / main_caption /
              call_to_action / hashtags.
            - bg_image_url, image_source, short_credit, image_verdict, slide_number,
              type 은 **절대 건드리지 마라.** 사진은 이미 검증을 통과한 것들이다.
            - body_text 는 슬라이드당 합계 100자 이하, 완결된 문장 1~2개. 넘치면 문장을
              줄이지 말고 다른 슬라이드로 나눠 담아라.
            - body_text 에 \n 을 넣지 마라. 줄바꿈은 renderer.py 가 정한다.
            - 날짜는 hook_line 에만 넣는다. main_caption 은 "30년 전 오늘,"로 연다.
            - 해시태그는 캡션 본문에 넣지 마라.
            - 사실관계를 새로 지어내지 마라. 지시가 사실 변경을 요구하면 고치지 말고
              revision_instruction 자리에 왜 못 고쳤는지 적어라.

            JSON 파일만 수정하고 다른 파일은 건드리지 마라. 커밋하지 마라.

      - name: 수정본 렌더링 준비
        if: steps.poll.outputs.needs_revision == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: 수정본 재전송
        if: steps.poll.outputs.needs_revision == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDS_REPO_TOKEN: ${{ secrets.CARDS_REPO_TOKEN }}
        run: |
          python approval_bot.py resend

      - name: 대기열 변경 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending/ || true
          git diff --staged --quiet || git commit -m "pending: 승인 처리 결과 반영"
          git push || echo "push 실패 - 다음 실행에서 다시 시도합니다"
