# 이 파일이 사는 곳: **postcoitum/30y-cards** 레포의 .github/workflows/claude_token_canary.yml
# (원본은 30y의 deploy/30y-cards/ - 손으로 복사하지 말 것, sync_cards_repo.yml이 반영한다)
#
# 왜 있는가:
#   `CLAUDE_CODE_OAUTH_TOKEN`은 "✏️ 수정" 기능에만 쓰이는데, 아무도 상태를 보지 않는다.
#   그래서 만료를 **사람이 수정 지시를 보낸 그 순간에** 알게 된다 - 카드를 고쳐야 하는
#   가장 급한 때다. 2026-08-04 · 08-08 · 08-21 세 번 모두 그랬다.
#   `META_ACCESS_TOKEN`은 token_refresh.py가 주 1회 챙기지만 이쪽은 대화형 로그인이라
#   자동 갱신이 불가능하다 - 그래서 **경보까지만** 한다.
#
# 왜 여기(공개 레포)인가:
#   점검 대상 시크릿이 여기 있고(수정 스텝이 이 레포에서 돈다), 공개 레포 러너는 무료다.
#
# 왜 매일 1회인가:
#   승인 지킴이(20분마다)에 붙이면 하루 40번 Claude를 깨우게 된다. 대신 카드 검토 전
#   하루 한 번만 같은 인증 경로를 실제로 확인해 수정 요청이 들어오기 전에 문제를 알린다.
name: Claude 토큰 만료 감시

on:
  schedule:
    # 매일 06:00 UTC = 15:00 KST. 카드 검토 전에 수정 엔진 인증을 확인한다.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # 토큰이 살아 있는지 보는 것이 전부다. 실제 수정 경로와 같은 액션·같은 시크릿을
      # 쓰는 것이 핵심 - 다른 방법으로 검사하면 "검사는 통과하는데 실전은 죽는" 상태가 된다.
      - name: 토큰으로 Claude를 한 번 깨워본다
        id: canary
        continue-on-error: true
        timeout-minutes: 5
        uses: anthropics/claude-code-action@16b3b310c3d7b5279df73130324d5205aeea8eac
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 1
          prompt: 'Reply with exactly: ok'

      - name: 수정 엔진 사전 점검 실패를 알린다
        if: steps.canary.outcome != 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --retry 3 --retry-all-errors \
            -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=⚠️ 수정 엔진 사전 점검에 실패했습니다. 원인은 Claude 인증 또는 실행 환경일 수 있습니다. 지금은 발행·보류·알림에 지장이 없지만, 이 상태로는 ✏️ 수정 지시가 실패할 수 있습니다. 로그: ${RUN_URL}" \
            || true
          exit 1
